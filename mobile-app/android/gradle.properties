org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows: the Kotlin incremental compiler intermittently fails to close its
# .tab cache files ("Could not close incremental caches"). Turning off
# incremental compilation makes each build a clean full compile - slower, but
# it succeeds. Safe to remove if the error stops recurring.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
